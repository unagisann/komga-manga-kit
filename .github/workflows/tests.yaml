name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libarchive-dev
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install 'build>=1.2,<2'
      - run: python scripts/build_release.py
      - run: python scripts/release_smoke.py --wheel dist/*-py3-none-any.whl --output /tmp/release-smoke.json
