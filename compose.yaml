services:
  manga-kit:
    build: .
    environment:
      MANGA_KIT_DATA_ROOT: /state
    volumes:
      - manga-kit-state:/state
    ports:
      - "127.0.0.1:5080:5080"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  manga-kit-state:
