# Relative paths are resolved against this file, not the source directory.
app:
  name: Komga Manga Kit
  demo: true
library:
  root: ./var/sample-library
  max_files: 50000 # Scans warn at 90% and stop at this many archives.
data:
  root: ./var/state
execution:
  enabled: false # Enable confirmed file/Komga operations; defaults to preview only.
  web_enabled: false # Opt in to reviewed normalization from a local/authenticated web session.
layout:
  status_folders:
    ongoing: 連載中
    completed: 完結
    unknown: 未分類
  series: "[{author}] {title}"
  book: "{title} 第{volume:02}巻{extension}"
  ongoing: "{status}/{series}"
  completed: "{status}/{kana_row}/{series}"
  unknown: "{status}/{series}"
komga:
  base_url: ""
  api_key_env: KOMGA_API_KEY
  timeout_seconds: 10
  path_mappings: []
  # Example: [{komga: /data/manga, local: /library}]
rakuten:
  enabled: false
  application_id_env: RAKUTEN_APPLICATION_ID
  access_key_env: RAKUTEN_ACCESS_KEY
  origin: "" # Optional registered website origin, e.g. https://manga.example.com
  timeout_seconds: 10
anilist:
  enabled: false # Explicit title searches for tags/genres; no API key required.
  timeout_seconds: 10
tools:
  kobo_enabled: false
  anime_enabled: false
  discovery_enabled: false
  rankings_enabled: false
  mangaupdates_enabled: false
  ai_enabled: false
  notify_enabled: false
  ai_provider: chat # chat (Chat Completions compatible) or gemini
  ai_url: ""
  ai_model: ""
  ai_key_env: MANGA_KIT_AI_KEY
  notify_url_env: MANGA_KIT_NOTIFY_URL
  public_komga_url: ""
  credentials_file: "" # Optional absolute path in a separate private config directory.
  reading_accounts: [] # [{name: Reader, api_key_env: KOMGA_READER_KEY}]
